name: Flutter Web CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/mjengohub/"

      # Deploy to Production only on push to main
      - name: Deploy to Live Site (mjengohub.co.ke)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages

      # Deploy Preview for Pull Requests
      - name: Deploy Staging Preview
        if: github.event_name == 'pull_request'
        uses: RossAsciuto/surge-preview-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dir: ./build/web
